# 禁用 fstrim（本机 UFS 拒绝 UNMAP/DISCARD，会把内核拖进长时间 D 态）。
#
# 事故复盘（2026-10-06）：fstrim.timer 到点触发 fstrim.service，内核对 UFS 下发
# UNMAP 被拒绝：
#   critical target error, dev sda, sector 3223040 op 0x3:(DISCARD)
#   Sense Key 0x5 (ILLEGAL REQUEST) / ASC 0x20 (INVALID COMMAND OPERATION CODE)
#   CDB opcode = 0x93 (UNMAP)
# 命令在 D 态长时间重试，接着 journald 也卡死，最终整机 load 105、无法登录。
# 周期性 trim 对本机没有任何收益（UFS 自带 GC），直接关掉。
#
# 为什么用 ConditionPathExists 而不是把 timer mask 到 /dev/null：
# 发布仓库的 rootfs/ 是经 debugfs 注入 ext4 镜像的（scripts/apply_local_overlay.sh
# 只能写普通文件，无法创建指向 /dev/null 的符号链接）。条件门禁效果等价：
# timer 仍会到点，但 service 每次都会因条件不满足而跳过。
# 确实需要手动 trim 时：touch /etc/polaris-allow-fstrim && systemctl start fstrim.service
[Unit]
ConditionPathExists=/etc/polaris-allow-fstrim
