# 给 systemd-journald 的重启行为设上限，避免「journald 卡死 -> 无限重启」把
# PID 1 拖垮。
#
# 事故复盘（2026-10-06）：journald 卡进 D 态后 SIGTERM 无效，systemd 反复
# 重启它并持续报 Failed to start systemd-journald.service；Uninterruptible
# 的进程 SIGKILL 也收不掉，最后一次性对 250 个 systemd-journal 进程发
# SIGKILL（"Processes still around after SIGKILL"），整个系统 load 105。
#
# 超过上限后 journald 保持 failed 状态、不再叠加新进程，系统至少还留得下
# 登录 / SSH 的能力去手工处理。RestartSec 拉长到 5 秒，避免密集重启。
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
RestartSec=5
