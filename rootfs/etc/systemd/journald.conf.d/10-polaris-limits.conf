# journald 限容 + 写限速（防止日志把 journald 拖进 D 态，进而拖死整机）。
#
# 事故复盘（2026-10-06）：UFS 拒绝 DISCARD 后 fstrim 长时间 D 态重试；同时
# polaris-adbd-setup 里的 `set -x` 每 3 秒往 journal 写 4~6 行，开机约 1 小时
# 42 分持久化 journal 就到了 343 MiB。journald 随后卡在 D 态，systemd 反复
# restart、SIGKILL 又收不掉 D 态进程，累积 250+ 个 unit，load average 冲到 105，
# getty/sshd/adbd 全部调度不上 —— 表现为虚拟键盘能回显字符（tty echo 由内核
# n_tty 完成，不依赖用户态）却敲不了回车、无法登录，SSH/ADB 也一起消失。
#
# SystemMaxUse 给持久化 journal 设硬上限，SystemKeepFree 保证磁盘始终有余量；
# RuntimeMaxUse 限制 /run 下的易失 journal；RateLimit* 给写入速率设闸，防止任何
# 循环刷屏在短时间内灌满日志。
[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
RuntimeMaxUse=64M
RateLimitIntervalSec=30s
RateLimitBurst=2000
