# 让 PID 1 接管硬件看门狗（/dev/watchdog）：systemd 每 RuntimeWatchdogSec 的
# 一半喂一次。内核 stall（RCU/oops panic）或 userspace（含 PID 1）停止推进时
# 喂狗中断，SoC 硬复位 —— 兜底所有类型的卡死。30 秒远高于正常负载抖动。
#
# 为什么必须同时显式设置 RebootWatchdogSec：
# 关机阶段 systemd 会用 RebootWatchdogSec 重设硬件超时；不设置时它默认按 10 分钟
# 去设，而 qcom_wdt 驱动会拒绝（超出驱动上限）→
#   "Failed to set watchdog hardware timeout to 10min: Invalid argument"
# 硬件狗于是停留在上一次设置的值上继续倒计时。关机收尾一旦有任何一步卡住，
# 硬件狗直接硬复位，journal 来不及提交 → rootfs 的组描述符/块位图出现不一致，
# 反复累积后会掉进 initramfs 救援 shell（该界面无任何键盘输入，只能重刷）。
# 因此两个超时都显式设成驱动能接受的值。
[Manager]
RuntimeWatchdogSec=30
RebootWatchdogSec=30
