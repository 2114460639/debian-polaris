[Login]
# logind 默认 HandlePowerKey=poweroff，启动时会 EVIOCGRAB 独占电源键设备，
# polaris-keys 一条事件都收不到。交给 polaris-keys 按次循环亮度。
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore

# 永不休眠：这台机器是手机，没有盖子/挂起键，也不希望空闲就挂起或休眠。
# IdleAction=ignore 表示空闲后什么都不做（只靠内核控制台 10 分钟熄屏，
# 见内核命令行 consoleblank=600）；IdleActionSec=0 表示空闲计时器不启用。
IdleAction=ignore
IdleActionSec=0
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore