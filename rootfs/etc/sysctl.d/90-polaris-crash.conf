# Hang auto-recovery for xiaomi-polaris (forensics hardening).
#
# 设备曾因 RCU kthread 饥饿整机卡死（CPU 满载，网络/sshd/adbd 全部无响应）。
# 把 RCU stall 变成 panic 后：stall -> panic -> systemd 停止喂硬件看门狗 ->
# SoC 自动复位，不需要长按电源。持久化 journal 保留卡死前日志。
#
# NOTE: softlockup_panic / hung_task_panic 在本内核不可用
# （CONFIG_SOFTLOCKUP_DETECTOR / CONFIG_DETECT_HUNG_TASK 未开启）；
# 这两类 hang 由下面的硬件看门狗兜底。
#
# kernel.panic = N：panic 之后内核自己再等 N 秒才复位。
# 原值 120 与上面注释里「自动复位」的意图自相矛盾，纯等待、没有任何收益，改为 10 秒。
kernel.panic = 10
kernel.panic_on_rcu_stall = 1
kernel.panic_on_oops = 1
